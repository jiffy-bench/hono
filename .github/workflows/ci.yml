# Replay farm copy of upstream's ci.yml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

name: ci
on:
  push:
    branches: [main, next]
    paths-ignore:
      - 'adapters/**'
  pull_request:
    branches: ['*']
    paths-ignore:
      - 'adapters/**'
      - 'docs/**'
      - '.vscode/**'
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  main:
    name: 'Main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.tool-versions'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          run_install: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'
      - run: pnpm run check
      - run: pnpm run editorconfig-checker -format github-actions
      - run: pnpm run build
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@02c50bf1bd316fe63e53fc577e7c50d2b72da277
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: vitest
          test-paths: src/
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          report: .jiffy/tests-vitest.json
      - name: "Replay farm: a directory for the test report"
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.jiffy"
          echo .jiffy/ >> "$GITHUB_WORKSPACE/.git/info/exclude"
      - name: Tensile vitest recorder
        id: tensile-record
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (true) }}
        continue-on-error: true
        uses: rsyed94/tensile-action/vitest@02c50bf1bd316fe63e53fc577e7c50d2b72da277
        with:
          step: setup
      - run: pnpm run test $TENSILE_VITEST_ARGS $TENSILE_REPORT_ARGS
        env:
          TENSILE_REPORT_ARGS: --reporter=default --reporter=json --outputFile.json=${{ github.workspace }}/.jiffy/tests-vitest.json --reporter=junit --outputFile.junit=${{ github.workspace }}/.jiffy/junit-vitest.xml
          TENSILE_VITEST_ARGS: ${{ steps.tensile-record.outputs.args }}
      - name: Tensile vitest collect
        if: ${{ !cancelled() && steps.tensile-record.outcome != 'skipped' }}
        continue-on-error: true
        uses: rsyed94/tensile-action/vitest@02c50bf1bd316fe63e53fc577e7c50d2b72da277
        with:
          step: collect
      - name: "Replay farm: send the coverage to Tensile"
        if: ${{ success() && steps.tensile-record.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SERVER: https://jiffy-app-production.up.railway.app
          PART: main
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$GITHUB_WORKSPACE/.jiffy" 2>/dev/null || { echo "::warning::no .jiffy directory: nothing recorded"; exit 0; }
          parts=(coverage-*.json)
          [ ${#parts[@]} -gt 0 ] || { echo "::warning::no coverage to send"; exit 0; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jiffy" | jq -r .value)
          echo "::add-mask::$token"
          put() { curl -sS --fail-with-body -X PUT -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @"$1" "$SERVER/v1/maps/$GITHUB_REPOSITORY/$GITHUB_SHA/$2/$3"; echo; }
          for f in "${parts[@]}"; do case "$f" in *-nodes.json | *-nodes.always-run.json) continue;; esac; put "$f" parts "$PART-${f%.json}"; done
          for f in report-*.json; do put "$f" durations "$PART-${f%.json}"; done
      - name: "Replay farm: is the Trunk token set"
        id: trunk-token
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          TRUNK_TOKEN_SET: ${{ secrets.TRUNK_API_TOKEN }}
        run: |
          if [ -n "$TRUNK_TOKEN_SET" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload test results to Trunk
        if: ${{ always() && steps.trunk-token.outputs.set == 'true' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc
        with:
          junit-paths: .jiffy/junit-vitest.xml
          org-slug: passport-mcp
          token: ${{ secrets.TRUNK_API_TOKEN }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-main
          path: coverage/
    permissions:
      contents: read
      id-token: write

  deno:
    name: 'Deno'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        with:
          deno-version-file: '.tool-versions'
      - run: env NAME=Deno deno test --coverage=coverage/raw/deno-runtime --allow-read --allow-env --allow-write --allow-net -c runtime-tests/deno/deno.json runtime-tests/deno
      - run: deno test -c runtime-tests/deno-jsx/deno.precompile.json --coverage=coverage/raw/deno-precompile-jsx runtime-tests/deno-jsx
      - run: deno test -c runtime-tests/deno-jsx/deno.react-jsx.json --coverage=coverage/raw/deno-react-jsx runtime-tests/deno-jsx
      - run: grep -R '"url":' coverage | grep -v runtime-tests | sed -e 's/.*file:..//;s/.,//' | xargs deno cache --unstable-sloppy-imports
      - run: deno coverage --lcov > coverage/deno-runtime-coverage-lcov.info
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-deno
          path: coverage/

  bun:
