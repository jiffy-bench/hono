# Replay farm copy of upstream's ci.yml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

name: ci
on:
  push:
    branches: [main, next]
    paths-ignore:
      - 'adapters/**'
  pull_request:
    branches: ['*']
    paths-ignore:
      - 'adapters/**'
      - 'docs/**'
      - '.vscode/**'
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  main:
    name: 'Main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.tool-versions'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          run_install: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.tool-versions'
      - run: pnpm run check
      - run: pnpm run editorconfig-checker -format github-actions
      - run: pnpm run build
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@a4a529f305d5a5ddeb1554cf4e0196f1fb6b5b0e
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: vitest
          test-paths: src/
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          report: .jiffy/no-report.json
      - run: pnpm run test
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-main
          path: coverage/
    permissions:
      contents: read
      id-token: write

  deno:
    name: 'Deno'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        with:
          deno-version-file: '.tool-versions'
      - run: env NAME=Deno deno test --coverage=coverage/raw/deno-runtime --allow-read --allow-env --allow-write --allow-net -c runtime-tests/deno/deno.json runtime-tests/deno
      - run: deno test -c runtime-tests/deno-jsx/deno.precompile.json --coverage=coverage/raw/deno-precompile-jsx runtime-tests/deno-jsx
      - run: deno test -c runtime-tests/deno-jsx/deno.react-jsx.json --coverage=coverage/raw/deno-react-jsx runtime-tests/deno-jsx
      - run: grep -R '"url":' coverage | grep -v runtime-tests | sed -e 's/.*file:..//;s/.,//' | xargs deno cache --unstable-sloppy-imports
      - run: deno coverage --lcov > coverage/deno-runtime-coverage-lcov.info
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-deno
          path: coverage/

