          node-version-file: '.tool-versions'
      - run: pnpm run build
      - run: pnpm run test:node

  workerd:
    name: 'workerd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
