        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
